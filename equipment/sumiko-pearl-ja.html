<main><article class="article device-article"><header class="article-header"><div class="meta">オーディオ機器 · MMカートリッジ</div><h1>Sumiko Pearl</h1></header>
<div class="article-cover device-cover"><img alt="Sumiko Pearl" src="../images/equipment/sumiko-pearl-1.jpg"/></div>
<p>滑らかで音楽的、厚みのある中域を持つクラシックなMMカートリッジ。</p>
<h2>主な仕様</h2><table class="specs"><tr><th>タイプ</th><td>Moving Magnet</td></tr><tr><th>針先形状</th><td>楕円</td></tr><tr><th>出力電圧</th><td>4.0 mV</td></tr><tr><th>針圧</th><td>1,5–2.0 g</td></tr><tr><th>推奨負荷</th><td>47 kΩ</td></tr></table>
